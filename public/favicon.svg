<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#bg)"/>

  <!-- Bold "H" with integrated loop -->
  <path d="M8 7 L8 25" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M8 16 L16 16" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M16 7 L16 16" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Loop element (circular arrow) -->
  <circle cx="20" cy="20" r="5" stroke="white" stroke-width="2.5" fill="none" stroke-dasharray="20 12"/>

  <!-- AI spark/star -->
  <circle cx="25" cy="8" r="2.5" fill="#FBBF24"/>
</svg>
